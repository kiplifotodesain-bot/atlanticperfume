 <style>
 *{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,serif}
 body{background:#0f2040;color:#fff;line-height:1.6;padding-top:80px}
 a{text-decoration:none}

 /* === MENU === */
 .menu-latar{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999}
 .menu-kotak{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#fff;z-index:1000;transition:right .3s}
 .menu-tutup{text-align:right;padding:15px 20px;font-size:22px;cursor:pointer;color:#333}
 .menu-judul{padding:10px 20px;font-weight:bold;color:#0f2040;border-bottom:1px solid #eee}
 .menu-item{display:block;padding:12px 20px;color:#333;border-bottom:1px solid #f5f5f5}
 .menu-item:hover{background:#f0f4ff}
 .menu-item.aktif{background:#e6f0ff;color:#0f2040;font-weight:bold}

 /* === TABEL === */
 table{width:100%;border-collapse:collapse;background:#ffffff08;border-radius:8px;overflow:hidden}
 th{padding:12px 8px;text-align:left;background:#ffffff15;border-bottom:2px solid #ffffff33}
 td{padding:12px 8px;border-bottom:1px solid #ffffff15}
 tr:hover{background:#ffffff10}
 .btn-beli{background:#00aa55;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer}
 </style>
</head>
<body>

<!-- ✅ KEPALA -->
<div style="position:fixed;top:0;left:0;right:0;background:#0f2040;padding:14px 15px;z-index:998;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff22">
 <span onclick="bukaMenu()" style="font-size:22px;cursor:pointer">☰</span>

 <span>🛒</span>
</div>

<!-- ✅ MENU -->
<div class="menu-latar" id="menuLatar" onclick="tutupMenu()"></div>
<div class="menu-kotak" id="menuKotak">
 <div class="menu-tutup" onclick="tutupMenu()">✕</div>
 <div class="menu-judul">📋 DAFTAR VARIAN</div>

</div>

<!-- ✅ DAFTAR PRODUK -->
<div style="max-width:720px;margin:0 auto;padding:20px 16px">
 <h2 id="namaKelompok" style="text-align:center;margin:10px 0 20px;font-size:20px"></h2>
 <table>
  <thead>
   <tr>
    <th>Nama Parfum</th>
    <th>Aroma</th>
    <th>Harga</th>
    <th></th>
   </tr>
  </thead>
  <tbody id="isiTabel">
   <tr><td colspan="4" style="text-align:center;padding:20px">⏳ Memuat...</td></tr>
  </tbody>
 </table>
 <div style="margin-top:25px;text-align:center">
  <a href="index.html" style="display:inline-block;padding:10px 22px;background:#ffffff15;color:#fff;border-radius:6px;border:1px solid #ffffff33">🏠 Kembali ke Beranda</a>
 </div>
</div>

<!-- ⚠️ URUTAN WAJIB: data → fungsi → kode halaman -->
<script src="data-produk.js"></script>
<script>
function bukaMenu(){document.getElementById('menuKotak').style.right='0';document.getElementById('menuLatar').style.display='block'}
function tutupMenu(){document.getElementById('menuKotak').style.right='-300px';document.getElementById('menuLatar').style.display='none'}

// TAMPILKAN DATA KE HALAMAN
if(typeof data !== 'undefined'){
  const k = data.kelompok1;
  document.getElementById('namaKelompok').textContent = k.nama;
  let html = '';
  k.produk.forEach(p => {
    html += `<tr>
      <td>${p.nama}</td>
      <td>${p.desk}</td>
      <td>Rp ${p.harga.toLocaleString('id-ID')}</td>
      <td><button class="btn-beli">+</button></td>
    </tr>`;
  });
  document.getElementById('isiTabel').innerHTML = html;
}else{
  document.getElementById('isiTabel').innerHTML = `<tr><td colspan="4" style="color:red;text-align:center">❌ File data-produk.js tidak ditemukan!</td></tr>`;
}
</script>

</body>
