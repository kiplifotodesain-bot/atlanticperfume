<script>
// === DATA PRODUK KELOMPOK 7 — TERLARIS | HARGA = 20ml ===
const dataProduk = {
  kelompok7: {
    judul: "🔥 TERLARIS",
    halaman: [
      [
        {kode:"LV334", nama:"La Vie Est Belle", aroma:"Bunga, manis, elegan — paling dicintai", harga:"Rp 248.400"},
        {kode:"LV463", nama:"Gucci Bloom", aroma:"Bunga murni, segar, mewah alami", harga:"Rp 220.800"},
        {kode:"LV070", nama:"SENSE Chance", aroma:"Jeruk, bunga, ceria, penuh semangat", harga:"Rp 192.600"},
        {kode:"LV215", nama:"Coco Noir", aroma:"Kayu, bunga, misterius, berkelas", harga:"Rp 234.000"},
        {kode:"LV589", nama:"Alien Goddess", aroma:"Bunga, vanila, hangat, mempesona", harga:"Rp 214.200"}
      ],
      [
        {kode:"MV101", nama:"Sauvage", aroma:"Jeruk, kayu, tegas, maskulin perkasa", harga:"Rp 205.200"},
        {kode:"MV202", nama:"Bleu de Chanel", aroma:"Jeruk, kayu, elegan, abadi", harga:"Rp 217.800"},
        {kode:"MV303", nama:"Acqua Di Gio", aroma:"Air segar, jeruk, tenang, berwibawa", harga:"Rp 198.000"},
        {kode:"MV404", nama:"1 Million", aroma:"Kayu manis, emas, mewah, berani", harga:"Rp 201.600"},
        {kode:"MV505", nama:"Le Male", aroma:"Lavender, mint, ikonik, penuh pesona", harga:"Rp 189.000"}
      ],
      [
        {kode:"EV001", nama:"Light Blue", aroma:"Jeruk segar, bunga, cerah, menyegarkan", harga:"Rp 176.400"},
        {kode:"EV002", nama:"J'adore", aroma:"Bunga emas, mewah, lembut bersinar", harga:"Rp 225.000"},
        {kode:"EV003", nama:"Chanel No. 5", aroma:"Aldehid, mawar, legenda, abadi", harga:"Rp 255.000"},
        {kode:"EV004", nama:"Miss Dior", aroma:"Bunga, manis, romantis, menawan", harga:"Rp 208.800"},
        {kode:"EV005", nama:"Beautiful", aroma:"Mawar, melati, romantis, abadi", harga:"Rp 195.000"}
      ],
      [
        {kode:"ZV001", nama:"Versace Eros", aroma:"Mint, apel, vanila, penuh gairah", harga:"Rp 185.400"},
        {kode:"ZV002", nama:"Lacoste White", aroma:"Bersih, segar, lembut, elegan murni", harga:"Rp 117.600"},
        {kode:"ZV003", nama:"Hugo Boss Bottled", aroma:"Apel, kayu manis, klasik, andalan", harga:"Rp 148.500"},
        {kode:"ZV004", nama:"Davidoff Cool Water", aroma:"Air dingin, segar, tajam, ikonik", harga:"Rp 112.500"},
        {kode:"ZV005", nama:"Nautica Voyage", aroma:"Laut, segar, lembut, sangat diminati", harga:"Rp 95.000"}
      ]
    ]
  }
};

let halamanSekarang = 0;
let dataHalaman = [];

function muatHalaman(){
  const k = dataProduk.kelompok7;
  dataHalaman = k.halaman;
  document.getElementById('namaKelompok').textContent = k.judul;
  tampilHalaman();
}

function tampilHalaman(){
  const totalHalaman = dataHalaman.length;
  const produk = dataHalaman[halamanSekarang];
  let html = '';
  produk.forEach(p => {
    const hargaAngka = parseInt((p.harga||'0').replace(/[^0-9]/g,''));
    html += `<tr>
      <td>${p.kode||'-'}</td>
      <td>${p.nama}</td>
      <td>${p.aroma}</td>
      <td>${p.harga}</td>
      <td><button class="btn-beli" onclick="tambahKeKeranjang('${(p.nama||'').replace(/'/g,"\\'")}', ${hargaAngka})">+</button></td>
    </tr>`;
  });
  document.getElementById('isiTabel').innerHTML = html;
  document.getElementById('infoHalaman').textContent = `Halaman ${halamanSekarang+1} dari ${totalHalaman}`;
  document.getElementById('btnSebelumnya').disabled = halamanSekarang <= 0;
  document.getElementById('btnSelanjutnya').disabled = halamanSekarang >= totalHalaman.length-1;
}

function halamanSebelumnya(){
  if(halamanSekarang > 0){ halamanSekarang--; tampilHalaman(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function halamanSelanjutnya(){
  if(halamanSekarang < dataHalaman.length-1){ halamanSekarang++; tampilHalaman(); window.scrollTo({top:0,behavior:'smooth'}); }
}

muatHalaman();
</script>
