<script>
const dataProduk = {
  halaman: [
    [
      {kode:"A1101", nama:"Acqua Di Gio Profondo", aroma:"Air laut, jeruk, kayu, segar mendalam", harga:"Rp 205.000"},
      {kode:"A1102", nama:"Bvlgari Aqva Pour Homme", aroma:"Air laut, batu, jeruk, sejuk bersih", harga:"Rp 165.000"},
      {kode:"A1103", nama:"Issey Miyake L'Eau Bleue", aroma:"Air segar, laut, jeruk, bersih elegan", harga:"Rp 145.000"},
      {kode:"A1104", nama:"Versace Man Eau Fraiche", aroma:"Air segar, jeruk, kayu, segar cerah", harga:"Rp 155.000"},
      {kode:"A1105", nama:"Giorgio Armani Acqua", aroma:"Air murni, jeruk, melati, segar tenang", harga:"Rp 185.000"}
    ],
    [
      {kode:"A1201", nama:"Davidoff Cool Water", aroma:"Air dingin, laut, mint, segar tajam", harga:"Rp 125.000"},
      {kode:"A1202", nama:"Nautica Voyage", aroma:"Laut, apel, daun teratai, segar lembut", harga:"Rp 95.000"},
      {kode:"A1203", nama:"Hugo Boss Ocean", aroma:"Air laut, jeruk, kayu, segar modern", harga:"Rp 135.000"},
      {kode:"A1204", nama:"Paco Rabanne Pure XS", aroma:"Air segar, jeruk, bunga, bersih memikat", harga:"Rp 145.000"},
      {kode:"A1205", nama:"Calvin Klein CK2", aroma:"Air segar, jeruk, kayu, segar berani", harga:"Rp 115.000"}
    ],
    [
      {kode:"B1101", nama:"Lacoste Red", aroma:"Air segar, buah, mint, berenergi", harga:"Rp 105.000"},
      {kode:"B1102", nama:"Swiss Army", aroma:"Air bersih, jeruk, herbal, segar kuat", harga:"Rp 95.000"},
      {kode:"B1103", nama:"Jaguar Green", aroma:"Air segar, jeruk, daun, segar alami", harga:"Rp 85.000"},
      {kode:"B1104", nama:"Porsche Sport", aroma:"Air laut, jeruk, kayu, segar bertenaga", harga:"Rp 110.000"},
      {kode:"B1105", nama:"Mercedes Benz Sea", aroma:"Air segar, jeruk, batu laut, elegan", harga:"Rp 135.000"}
    ],
    [
      {kode:"B1201", nama:"Lattafa Haya", aroma:"Air segar, bunga, musky, lembut sejuk", harga:"Rp 85.000"},
      {kode:"B1202", nama:"Armaf Fresco", aroma:"Air murni, jeruk, buah, segar cerah", harga:"Rp 90.000"},
      {kode:"B1203", nama:"Asdaaf Fresh", aroma:"Air segar, mint, jeruk, segar bersih", harga:"Rp 82.000"},
      {kode:"B1204", nama:"Ajmal Aqua", aroma:"Air segar, bunga, jeruk, sejuk lembut", harga:"Rp 88.000"},
      {kode:"B1205", nama:"Afnan Pure Water", aroma:"Air murni, jeruk, melati, segar tenang", harga:"Rp 78.000"}
    ]
  ]
};

let halamanSekarang = 0;
let dataHalaman = dataProduk.halaman;

function muatHalaman(){
  document.getElementById('namaKelompok').textContent = "🌊 SEGAR — Laut";
  tampilHalaman();
}

function tampilHalaman(){
  const totalHalaman = dataHalaman.length;
  const produk = dataHalaman[halamanSekarang];
  let html = '';
  produk.forEach(p => {
    const hargaAngka = parseInt((p.harga||'0').replace(/[^0-9]/g,''));
    html += `<tr>
      <td>${p.kode||'-'}</td>
      <td>${p.nama}</td>
      <td>${p.aroma}</td>
      <td>${p.harga}</td>
      <td><button class="btn-beli" onclick="tambahKeKeranjang('${(p.nama||'').replace(/'/g,"\\'")}', ${hargaAngka})">+</button></td>
    </tr>`;
  });
  document.getElementById('isiTabel').innerHTML = html;
  document.getElementById('infoHalaman').textContent = `Halaman ${halamanSekarang+1} dari ${totalHalaman}`;
  document.getElementById('btnSebelumnya').disabled = halamanSekarang <= 0;
  document.getElementById('btnSelanjutnya').disabled = halamanSekarang >= totalHalaman.length-1;
}

function halamanSebelumnya(){
  if(halamanSekarang > 0){ halamanSekarang--; tampilHalaman(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function halamanSelanjutnya(){
  if(halamanSekarang < dataHalaman.length-1){ halamanSekarang++; tampilHalaman(); window.scrollTo({top:0,behavior:'smooth'}); }
}

muatHalaman();
</script>
