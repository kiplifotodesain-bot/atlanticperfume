<script>
// === DATA PRODUK KELOMPOK 5 — REMPAH KUAT | HARGA = 20ml ===
const dataProduk = {
  kelompok5: {
    judul: "🌶️ REMPAH — Kuat",
    halaman: [
      [
        {kode:"A0901", nama:"Chanel No. 5", aroma:"Aldehid, mawar, rempah, ikonik", harga:"Rp 255.000"},
        {kode:"A0902", nama:"Dior Fahrenheit", aroma:"Bunga, rempah, kulit, tegas", harga:"Rp 175.000"},
        {kode:"A0903", nama:"Paco Rabanne XS Pour Homme", aroma:"Rempah, kayu, jeruk, berani", harga:"Rp 145.000"},
        {kode:"A0904", nama:"YSL Opium", aroma:"Rempah, bunga, kayu, memikat", harga:"Rp 195.000"},
        {kode:"A0905", nama:"Armani Privé", aroma:"Rempah timur, bunga, mewah", harga:"Rp 225.000"}
      ],
      [
        {kode:"A1001", nama:"Gucci Guilty", aroma:"Jeruk, rempah, bunga, berani", harga:"Rp 165.000"},
        {kode:"A1002", nama:"Hugo Boss Dark Blue", aroma:"Jahe, kayu, rempah, kuat", harga:"Rp 135.000"},
        {kode:"A1003", nama:"Bvlgari BLV", aroma:"Jahe, bunga biru, tegas modern", harga:"Rp 145.000"},
        {kode:"A1004", nama:"Kenzo Pour Homme", aroma:"Jeruk, rempah, kayu, segar pedas", harga:"Rp 125.000"},
        {kode:"A1005", nama:"Givenchy Pi", aroma:"Rempah manis, kayu, hangat", harga:"Rp 140.000"}
      ],
      [
        {kode:"B0901", nama:"Spice Bomb Extreme", aroma:"Rempah hangat, lada, kulit, tegas", harga:"Rp 155.000"},
        {kode:"B0902", nama:"Aramis Classic", aroma:"Rempah, kayu, herbal, ikonik", harga:"Rp 115.000"},
        {kode:"B0903", nama:"Lattafa Asad", aroma:"Rempah eksotis, oud, kemenyan, kuat", harga:"Rp 95.000"},
        {kode:"B0904", nama:"Armaf Bukhoor", aroma:"Rempah hangat, kemenyan, mendalam", harga:"Rp 90.000"},
        {kode:"B0905", nama:"Ajmal Rain", aroma:"Rempah lembut, jeruk, segar tegas", harga:"Rp 85.000"}
      ],
      [
        {kode:"B1001", nama:"Mancera Red Tobacco", aroma:"Rempah, tembakau, manis, memikat", harga:"Rp 165.000"},
        {kode:"B1002", nama:"Asdaaf Raghba", aroma:"Rempah, kayu, manis, khas timur", harga:"Rp 88.000"},
        {kode:"B1003", nama:"Lattafa Qaed Al Fursan", aroma:"Rempah, buah, vanila, tegas memikat", harga:"Rp 92.000"},
        {kode:"B1004", nama:"Afnan 9PM", aroma:"Rempah, bunga, kayu, misterius", harga:"Rp 85.000"},
        {kode:"B1005", nama:"Armaf Club Intense", aroma:"Rempah, kayu, ambar, tegas elegan", harga:"Rp 95.000"}
      ]
    ]
  }
};

let halamanSekarang = 0;
let dataHalaman = [];

function muatHalaman(){
  const k = dataProduk.kelompok5;
  dataHalaman = k.halaman;
  document.getElementById('namaKelompok').textContent = k.judul;
  tampilHalaman();
}

function tampilHalaman(){
  const totalHalaman = dataHalaman.length;
  const produk = dataHalaman[halamanSekarang];
  let html = '';
  produk.forEach(p => {
    const hargaAngka = parseInt((p.harga||'0').replace(/[^0-9]/g,''));
    html += `<tr>
      <td>${p.kode||'-'}</td>
      <td>${p.nama}</td>
      <td>${p.aroma}</td>
      <td>${p.harga}</td>
      <td><button class="btn-beli" onclick="tambahKeKeranjang('${(p.nama||'').replace(/'/g,"\\'")}', ${hargaAngka})">+</button></td>
    </tr>`;
  });
  document.getElementById('isiTabel').innerHTML = html;
  document.getElementById('infoHalaman').textContent = `Halaman ${halamanSekarang+1} dari ${totalHalaman}`;
  document.getElementById('btnSebelumnya').disabled = halamanSekarang <= 0;
  document.getElementById('btnSelanjutnya').disabled = halamanSekarang >= totalHalaman.length-1;
}

function halamanSebelumnya(){
  if(halamanSekarang > 0){ halamanSekarang--; tampilHalaman(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function halamanSelanjutnya(){
  if(halamanSekarang < dataHalaman.length-1){ halamanSekarang++; tampilHalaman(); window.scrollTo({top:0,behavior:'smooth'}); }
}

muatHalaman();
</script>
