<script>
// === DATA PRODUK KELOMPOK 2 — BUNGA ELEGAN | HARGA = 20ml ===
const dataProduk = {
  kelompok2: {
    judul: "🌸 BUNGA — Elegan",
    halaman: [
      [
        {kode:"A0301", nama:"Chanel Mademoiselle", aroma:"Mawar, melati, jeruk, elegan", harga:"Rp 225.000"},
        {kode:"A0302", nama:"Dior J'adore", aroma:"Ylang-ylang, mawar, melati, mewah", harga:"Rp 215.000"},
        {kode:"A0303", nama:"Gucci Bloom", aroma:"Melati, akar anggrek, bunga putih", harga:"Rp 195.000"},
        {kode:"A0304", nama:"Lancome La Vie Est Belle", aroma:"Iris, mawar, pir, manis lembut", harga:"Rp 185.000"},
        {kode:"A0305", nama:"YSL Parisienne", aroma:"Mawar, violet, bunga segar", harga:"Rp 175.000"}
      ],
      [
        {kode:"A0401", nama:"Bvlgari Rose Essentielle", aroma:"Mawar tua, kastanye, lembut", harga:"Rp 145.000"},
        {kode:"A0402", nama:"Calvin Klein Eternity", aroma:"Mawar, melati, lili, klasik lembut", harga:"Rp 115.000"},
        {kode:"A0403", nama:"Estée Lauder Beautiful", aroma:"Mawar, melati, lili, romantis", harga:"Rp 135.000"},
        {kode:"A0404", nama:"Elizabeth Arden Green Tea", aroma:"Bunga segar, teh, menenangkan", harga:"Rp 95.000"},
        {kode:"A0405", nama:"Versace Bright Crystal", aroma:"Pivoine, melati, buah segar", harga:"Rp 140.000"}
      ],
      [
        {kode:"B0301", nama:"Elie Saab Le Parfum", aroma:"Bunga melati, jeruk, madu, lembut", harga:"Rp 155.000"},
        {kode:"B0302", nama:"Carolina Herrera Good Girl", aroma:"Bunga putih, kakao, ambar, tegas", harga:"Rp 165.000"},
        {kode:"B0303", nama:"Valentino Donna", aroma:"Mawar, ambar, kayu, anggun mendalam", harga:"Rp 175.000"},
        {kode:"B0304", nama:"Roberto Cavalli", aroma:"Bunga campuran, kayu, mewah lembut", harga:"Rp 135.000"},
        {kode:"B0305", nama:"Salvatore Ferragamo", aroma:"Bunga segar, buah, elegan halus", harga:"Rp 125.000"}
      ],
      [
        {kode:"B0401", nama:"Bottega Veneta Illusione", aroma:"Bunga segar, buah, kayu, lembut", harga:"Rp 145.000"},
        {kode:"B0402", nama:"Tiziana Terenzi", aroma:"Bunga langka, buah, ambar, mewah", harga:"Rp 195.000"},
        {kode:"B0403", nama:"Xerjoff Erba Pura", aroma:"Buah segar, bunga putih, musky, cerah", harga:"Rp 245.000"},
        {kode:"B0404", nama:"Mancera Red Tobacco", aroma:"Bunga, tembakau, manis, memikat", harga:"Rp 165.000"},
        {kode:"B0405", nama:"Roja Dove", aroma:"Bunga murni, kayu, ambar, mewah murni", harga:"Rp 255.000"}
      ]
    ]
  }
};

let halamanSekarang = 0;
let dataHalaman = [];

function muatHalaman(){
  const k = dataProduk.kelompok2;
  dataHalaman = k.halaman;
  document.getElementById('namaKelompok').textContent = k.judul;
  tampilHalaman();
}

function tampilHalaman(){
  const totalHalaman = dataHalaman.length;
  const produk = dataHalaman[halamanSekarang];
  let html = '';
  produk.forEach(p => {
    const hargaAngka = parseInt((p.harga||'0').replace(/[^0-9]/g,''));
    html += `<tr>
      <td>${p.kode||'-'}</td>
      <td>${p.nama}</td>
      <td>${p.aroma}</td>
      <td>${p.harga}</td>
      <td><button class="btn-beli" onclick="tambahKeKeranjang('${(p.nama||'').replace(/'/g,"\\'")}', ${hargaAngka})">+</button></td>
    </tr>`;
  });
  document.getElementById('isiTabel').innerHTML = html;
  document.getElementById('infoHalaman').textContent = `Halaman ${halamanSekarang+1} dari ${totalHalaman}`;
  document.getElementById('btnSebelumnya').disabled = halamanSekarang <= 0;
  document.getElementById('btnSelanjutnya').disabled = halamanSekarang >= totalHalaman.length-1;
}

function halamanSebelumnya(){
  if(halamanSekarang > 0){ halamanSekarang--; tampilHalaman(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function halamanSelanjutnya(){
  if(halamanSekarang < dataHalaman.length-1){ halamanSekarang++; tampilHalaman(); window.scrollTo({top:0,behavior:'smooth'}); }
}

muatHalaman();
</script>
